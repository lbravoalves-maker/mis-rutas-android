
name: Build Mis Rutas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Corregir carpetas del proyecto
        run: |
          mkdir -p src
          cp "scr/main.js." src/main.js
          cp "scr/style.css." src/style.css

      - name: Instalar dependencias
        run: npm install

      - name: Crear aplicacion web
        run: npm run build

      - name: Configurar Capacitor
        run: npx cap init "Mis Rutas" "com.misrutas.app" --web-dir dist

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mis-Rutas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
